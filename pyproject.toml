[project]
name = "alteris-auth-service"
version = "0.1.0"
description = "Alteris authentication service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.13.3",
    "asyncpg==0.30.0",
    "boto3==1.35.0",
    "bcrypt==4.0.1",
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "mangum==0.17.0",
    "passlib[bcrypt]==1.7.4",
    "psycopg2-binary==2.9.10",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.12",
    "python-slugify>=8.0.4",
    "sqlalchemy==2.0.36",
    "stripe==11.1.0",
    "supabase==2.9.1",
    "uvicorn==0.31.0",
]

[dependency-groups]
dev = [
    "mypy==1.13.0",
    "pre-commit>=4.6.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "ruff==0.9.0",
    "types-passlib==1.7.7.20240819",
    "types-python-jose==3.3.4.20240106",
]

[tool.ruff]
target-version = "py312"
line-length = 100

extend-exclude = [
    "alembic/versions",
]
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import order)
    "B",   # flake8-bugbear (common bugs)
    "C4",  # flake8-comprehensions (simpler comprehensions)
    "UP",  # pyupgrade (modern Python syntax)
    "N",   # pep8-naming
    "ANN", # flake8-annotations (type hints)
    "S",   # flake8-bandit (security)
    "RUF", # Ruff-specific rules
]

ignore = [
    "S101",   # use of assert (fine in tests)
    "B008",   # do not perform function calls in default args (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]  # relax annotations + security in tests

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["stripe.*", "supabase.*", "mangum.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
