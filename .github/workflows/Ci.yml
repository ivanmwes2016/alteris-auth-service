name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  check:
    name: Lint, type-check & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: alteris-auth-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Debug workspace
        run: |
          pwd
          ls -la

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format check
        run: uv run ruff format app tests --check

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app/

      - name: Test
        run: uv run pytest tests/ -v
